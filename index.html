<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Type Scaling — DS Type Scale Tool</title>
  <meta name="description" content="Generate Design System type scales optimized for vertical rhythm (8pt grid). Adapts to each font's metrics using Capsize data." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/layout.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
</head>
<body>
  <div class="app">
    <!-- ─── Header ─── -->
    <header class="app-header">
      <div class="app-header__left">
        <h1 class="app-header__title">Type Scaling</h1>
        <p class="app-header__subtitle">Vertical-rhythm type scales for any Google Font</p>
      </div>
      <div class="app-header__right">
        <span class="copy-url-feedback" id="copy-url-feedback"></span>
        <button class="btn btn--tertiary" id="copy-url-btn" aria-label="Copy shareable URL">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Copy URL
        </button>
        <div id="theme-toggle-slot"></div>
      </div>
    </header>

    <!-- ─── Main 3-column layout ─── -->
    <main class="app-main">
      <!-- Left column -->
      <aside class="panel-left">
        <div class="panel-left__header">
          <div id="font-selector-slot"></div>
        </div>
        <div class="panel-left__body">
          <div id="font-preview-slot"></div>
        </div>
        <div class="panel-left__footer" id="font-meta-slot"></div>
      </aside>

      <!-- Center column -->
      <section class="panel-center" style="position: relative;">
        <div id="scale-slot"></div>
        <div class="loading-overlay">
          <div class="spinner"></div>
        </div>
      </section>

      <!-- Expand button (visible when right panel is collapsed) -->
      <button class="panel-expand-btn" aria-label="Expand code panel" data-expand-panel>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
      </button>

      <!-- Right column (becomes overlay on medium) -->
      <aside class="panel-right">
        <div id="code-slot"></div>
        <div class="panel-right__footer" id="download-slot"></div>
      </aside>
    </main>

    <!-- View Code button (medium breakpoint) -->
    <button class="view-code-btn">
      <span>&#60;/&#62;</span> View Code
    </button>

    <!-- Overlay backdrop -->
    <div class="panel-overlay-backdrop"></div>

    <!-- Mobile navigation -->
    <nav class="mobile-nav">
      <button class="mobile-nav__tab is-active" data-panel="panel-left">
        <span class="mobile-nav__tab-icon">A</span>
        Font
      </button>
      <button class="mobile-nav__tab" data-panel="panel-center">
        <span class="mobile-nav__tab-icon">T</span>
        Scale
      </button>
      <button class="mobile-nav__tab" data-panel="panel-right">
        <span class="mobile-nav__tab-icon">&lt;/&gt;</span>
        Code
      </button>
    </nav>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
